name: Bug report
description: Something isn't working as expected
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please search [existing issues](https://github.com/Agni-glitch/node-chat-application/issues) first.
        **Security problems:** don't file them here; follow [SECURITY.md](https://github.com/Agni-glitch/node-chat-application/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in as two users in separate browsers
        2. Open a group chat
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Direct chats
        - Group chats
        - Disappearing messages
        - AI models
        - Sign-up / login / OTP
        - Profile
        - Deployment / configuration
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser and OS, Node version, and whether this is local or deployed (and where).
      placeholder: Chrome 140 on Windows 11, Node 24, local dev
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Browser console and server output help a lot. Remove any secrets, tokens or emails first.
      render: shell
