name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install
        run: npm run install:all

      - name: Server tests
        run: npm test --prefix server

      - name: Client tests
        run: npm run test:ci --prefix client

      - name: Client production build (same settings as Vercel)
        env:
          CI: true
          GENERATE_SOURCEMAP: false
          REACT_APP_API_URL: https://api.example.com
        run: node client/scripts/check-env.js && npm run build --prefix client

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t quick-chat:ci .

  # The single check required by the "Protect main" ruleset. Branch rules point at this job
  # instead of each matrix entry, so changing Node versions or adding jobs never blocks merges.
  result:
    name: CI result
    if: always()
    needs: [test, docker]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        run: |
          echo "test: ${{ needs.test.result }}, docker: ${{ needs.docker.result }}"
          [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.docker.result }}" = "success" ]
