# Local development and testing with Docker. Nothing here is used in production.
#
#   docker compose up                 Dev stack with hot reload: app http://localhost:3000,
#                                     API http://localhost:5000, emails http://localhost:8025
#   docker compose up -d mongo mailpit
#                                     Only MongoDB + Mailpit, for running the code natively
#   docker compose --profile prod up --build app
#                                     The production Docker image on http://localhost:8080
#   docker compose down               Stop everything (add -v to also wipe the database)
#
# Optional: a .env file next to this one can set CLOUDINARY_* keys (image uploads) and
# host ports: MONGO_PORT (27017), MAILPIT_PORT (8025), SMTP_PORT_HOST (1025), PROD_PORT (8080).
# Already running MongoDB on 27017? Set MONGO_PORT=27018; containers are unaffected.
# DOCKER_POLLING=false turns off polling file watchers (only if the repo lives in WSL2/Linux).
# All other values below are local-only placeholders, not real secrets.

name: quick-chat

x-local-env: &local-env
  SKIP_DOTENV: "true" # ignore server/.env so local credentials never leak into containers
  JWT_SECRET: local-dev-jwt-secret-not-for-production-0123456789
  AI_KEYS_SECRET: local-dev-ai-keys-secret-not-for-production-0123456789
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  MAIL_FROM: Quick Chat <no-reply@quick-chat.local>
  EMAIL_MX_CHECK: "false"
  CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
  CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
  CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}

services:
  mongo:
    image: mongo:9.0
    ports:
      - "${MONGO_PORT:-27017}:27017" # change if you already run MongoDB locally
    volumes:
      - mongo-data:/data/db
    # A plain TCP check: mongosh is a Node.js app that can take >5 s just to start on a busy
    # 2-CPU laptop (e.g. while the client runs npm install), which wrongly marked Mongo unhealthy.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/27017"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  # Catches every email the app sends. Read verification codes at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.32
    ports:
      - "${MAILPIT_PORT:-8025}:8025" # web inbox
      - "${SMTP_PORT_HOST:-1025}:1025" # SMTP

  # API with auto-reload. Source is mounted from ./server; node_modules live in a volume.
  server:
    image: node:24-alpine
    working_dir: /app/server
    command: sh -c "npm install --no-audit --no-fund --fetch-retries=5 && npx nodemon --legacy-watch server.js"
    environment:
      <<: *local-env
      NODE_ENV: development
      PORT: "5000"
      MONGODB_URI: mongodb://mongo:27017/quick-chat
      CLIENT_URL: http://localhost:3000
      E2E_MONGODB_URI: mongodb://mongo:27017/quick-chat-e2e
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app/server
      - server-node-modules:/app/server/node_modules
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  # React dev server with hot reload. Source is mounted from ./client.
  client:
    image: node:24-alpine
    working_dir: /app/client
    command: sh -c "npm install --no-audit --no-fund --fetch-retries=5 && npm start"
    environment:
      REACT_APP_API_URL: http://localhost:5000
      BROWSER: none
      # Windows/macOS bind mounts send no file events, so watch by polling. Costs CPU; set
      # DOCKER_POLLING=false if the repo lives inside the WSL2/Linux filesystem.
      WATCHPACK_POLLING: ${DOCKER_POLLING:-true}
      CHOKIDAR_USEPOLLING: ${DOCKER_POLLING:-true}
      WDS_SOCKET_PORT: "3000"
    stdin_open: true # the CRA dev server exits when stdin closes
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app/client
      - client-node-modules:/app/client/node_modules
    depends_on:
      - server

  # The production image (same Dockerfile as a real deploy) serving API + UI on one origin.
  app:
    profiles: [prod]
    build: .
    environment:
      <<: *local-env
      NODE_ENV: production
      SERVE_CLIENT: "true"
      HTTPS_ONLY: "false" # plain http on localhost; real deploys keep the default (true)
      TRUST_PROXY: "0"
      MONGODB_URI: mongodb://mongo:27017/quick-chat-prod
      MONGO_AUTO_INDEX: "true"
    ports:
      - "${PROD_PORT:-8080}:5000"
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  mongo-data:
  server-node-modules:
  client-node-modules:
